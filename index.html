
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>عصام سبورتبول TV</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #08111f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      padding: 28px 12px;
      background: #101e32;
      border-bottom: 3px solid #20d69a;
    }
    h1 { color: #20d69a; margin: 0 0 10px; }
    main { padding: 24px 14px; }
    .panel {
      max-width: 650px;
      margin: 18px auto;
      padding: 24px 16px;
      background: #14243a;
      border: 1px solid #29415d;
      border-radius: 14px;
    }
    .watch {
      display: inline-block;
      margin-top: 18px;
      padding: 17px 30px;
      background: #20d69a;
      color: #07151a;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      text-decoration: none;
    }
    .note { color: #c2ccda; line-height: 1.8; }
    a:focus { outline: 4px solid white; }
    footer { padding: 20px; color: #9aabc0; }
  </style>
</head>
<body>
  <header>
    <h1>عصام سبورتبول TV</h1>
    <div>عالم المباريات بين إيديك</div>
  </header>

  <main>
    <section class="panel">
      <h2>⚽ مشاهدة المباريات</h2>
      <p class="note">
        اضغط أدناه لفتح موقع سبورتينا ومتابعة المباريات
        والمحتوى الرياضي المتاح.
      </p>
      <a class="watch"
         href="https://www.sportinaa.com/"
         rel="noopener">
        ▶ مشاهدة عبر سبورتينا
      </a>
    </section>

    <section class="panel">
      <h2>📺 المباريات والأخبار</h2>
      <p class="note">
        اختر مشاهدة سبورتينا لمعرفة المحتوى المتاح حالياً.
        توفر البث يعتمد على الموقع وحقوق النقل.
      </p>
    </section>
  </main>

  <footer>Essamsportball</footer>
</body>
</html>
