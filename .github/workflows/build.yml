
name: Diwaniya Sports TV - Toolchain Check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check-toolchain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check project interface
        run: test -f index.html

      - name: Download OpenOrbis toolchain
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git toolchain
          echo "Toolchain repository downloaded"
          ls -la toolchain
          
