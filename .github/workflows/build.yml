
name: Diwaniya Sports TV - Prepare Project

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract starter ZIP
        run: |
          mkdir -p extracted
          unzip -o DiwaniyaSportsTV-starter.zip -d extracted
          echo "Files found in the archive:"
          find extracted -type f
          
