
name: Diwaniya Sports TV Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check web interface
        run: test -f index.html

      - name: Check native source
        run: test -f native/src/main.cpp

      - name: Show build requirements
        run: |
          echo "Project files are present."
          echo "A PS4 SDK and native app configuration are still required."
          echo "This workflow does not create a PKG yet."
          find native data -maxdepth 3 -type f
          
