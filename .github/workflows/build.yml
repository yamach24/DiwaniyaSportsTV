name: Check Diwaniya Sports TV project

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Check app interface exists
        run: test -f index.html

      - name: Show project files
        run: ls -la
