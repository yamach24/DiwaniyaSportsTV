
name: Diwaniya Sports TV - Prepare Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract starter ZIP
        run: |
          mkdir -p extracted
          unzip -o DiwaniyaSportsTV-starter.zip -d extracted
          find extracted -type f

      - name: Package extracted project
        run: |
          cd extracted
          zip -r ../DiwaniyaSportsTV-Project.zip .

      - name: Upload project files
        uses: actions/upload-artifact@v4
        with:
          name: DiwaniyaSportsTV-Project
          path: DiwaniyaSportsTV-Project.zip
