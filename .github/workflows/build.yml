
name: Prepare Diwaniya Sports TV

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract starter ZIP
        run: |
          unzip -o DiwaniyaSportsTV-starter.zip -d extracted
          echo "Project files extracted:"
          find extracted -maxdepth 3 -type f
